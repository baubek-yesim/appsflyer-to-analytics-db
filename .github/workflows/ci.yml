name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: statistics
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint + format + type check (pre-commit)
        run: uv run pre-commit run --all-files

      - name: Test (pytest)
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_USER: root
          DB_PASSWORD: ""
          DB_NAME: statistics
          DB_TABLE: appsflyer_purchase_events
          DB_TABLE_INSTALLS: appsflyer_installs_fb
          APPSFLYER_API_TOKEN: test-token
          APPSFLYER_APP_IDS: id1458505230
          # APPSFLYER_ENABLED_REPORTS is deliberately NOT set here either
          # (BAF-11 stage 4): its default already keeps installs out of a run,
          # and the tests that need installs enabled set it themselves — an
          # ambient value would mask a regression in that default. Setting it
          # to include installs_non_organic,installs_retargeting is how an
          # operator manually opts a run into pulling installs; the deployed
          # timer keeps the default until the real cutover decision.
          # APPSFLYER_MEDIA_SOURCE / APPSFLYER_EVENT_NAMES are deliberately NOT
          # set here (BAF-11 stage 1). The integration tests never read them, and
          # an ambient value would leak into the unit tests that assert the
          # unset-means-no-filter behavior. The tests clear them explicitly too.
        run: uv run pytest --cov-fail-under=98
